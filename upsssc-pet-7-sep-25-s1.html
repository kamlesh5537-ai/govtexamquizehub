let current = 0;
let answers = Array(questions.length).fill(null);
let review = Array(questions.length).fill(false);
let submitted = false;
let seconds = 120 * 60;

function refFor(n) {
  if (n === 9) return ["Workshop table (Q9–13)", refs.workshop];
  if (n === 21) return ["Voter table (Q21–25)", refs.voters];
  if (n === 26) return ["Shirt-sales line graph (Q26–30)", refs.graph];
  if (n === 36) return ["Passage: Prabhavati (Q36–40)", refs.prabhavati];
  if (n === 41) return ["Passage: Indian literary theory (Q41–45)", refs.rasa];
  if (n === 94) return ["Passage: Reading (Q94–95)", refs.reading];
  return null;
}

function render() {
  const item = questions[current];
  const r = refFor(item.n);
  document.getElementById("refBox").innerHTML = r
    ? `<div class="ref"><div class="ref-title">${r[0]}</div><img src="${r[1]}" alt="Reference material"></div>`
    : "";

  let h = `<div class="question-no">Question ${item.n} of ${questions.length}</div>`;
  h += `<div class="question">${escapeHtml(item.q)}</div>`;
  item.o.forEach((opt,i)=>{
    const checked = answers[current] === i ? "checked" : "";
    h += `<label class="option"><input type="radio" name="opt" value="${i}" ${checked} onchange="choose(${
      i
    })"> ${String.fromCharCode(65+i)}) ${escapeHtml(opt)}</label>`;
  });
  document.getElementById("questionBox").innerHTML = h;
  updatePalette();
  updateStats();
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function choose(i) {
  if (submitted) return;
  answers[current] = i;
  updatePalette();
  updateStats();
}

function nextQ() {
  if (current < questions.length - 1) {
    current++;
    render();
  }
}

function prevQ() {
  if (current > 0) {
    current--;
    render();
  }
}

function toggleReview() {
  review[current] = !review[current];
  updatePalette();
}

function updatePalette() {
  const p = document.getElementById("palette");
  p.innerHTML = "";
  questions.forEach((q,i)=>{
    const b = document.createElement("button");
    b.className = "pbtn" + (i===current ? " current":"") +
      (answers[i] !== null ? " answered":"") +
      (review[i] ? " review":"");
    b.textContent = q.n;
    b.onclick = () => { current=i; render(); };
    p.appendChild(b);
  });
}

function updateStats() {
  const a = answers.filter(x=>x!==null).length;
  document.getElementById("answeredCount").textContent = a;
  document.getElementById("unansweredCount").textContent = questions.length-a;
}

function submitPaper(auto=false) {
  if (submitted) return;
  if (!auto && !confirm("क्या आप paper submit करना चाहते हैं?")) return;
  submitted = true;
  let correct=0, wrong=0, blank=0;
  answers.forEach((a,i)=>{
    if (a === null) blank++;
    else if (a === questions[i].a) correct++;
    else wrong++;
  });
  const score = correct - wrong*0.25;
  const r = document.getElementById("result");
  r.style.display="block";
  r.innerHTML = `<h2>Result</h2>
    <p><b>Score:</b> ${score.toFixed(2)} / 100</p>
    <p><b>Correct:</b> ${correct} &nbsp; <b>Wrong:</b> ${wrong} &nbsp; <b>Unanswered:</b> ${blank}</p>
    <p class="note">उत्तर-कुंजी को उपलब्ध master-set answer key और आपके uploaded paper के प्रश्नों से मिलाकर digitize किया गया है। स्कैन/OCR के कारण कुछ पाठ में मामूली typing/formatting अंतर हो सकते हैं।</p>`;
  document.querySelectorAll("input").forEach(x=>x.disabled=true);
}

function tick() {
  if (submitted) return;
  const m = Math.floor(seconds/60);
  const s = seconds % 60;
  document.getElementById("timer").textContent =
    String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  if (seconds <= 0) {
    submitPaper(true);
    return;
  }
  seconds--;
}
setInterval(tick,1000);
tick();
render();
</script>
