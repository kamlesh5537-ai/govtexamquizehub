<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,'Noto Sans Devanagari',sans-serif;background:#f3f6fb;color:#182230}

let current = 0;
let answers = Array(questions.length).fill(null);
let review = Array(questions.length).fill(false);
let timeLeft = 120 * 60;
let timer;

function renderPalette(){
  const p=document.getElementById('palette');
  p.innerHTML='';
  questions.forEach((_,i)=>{
    const b=document.createElement('button');
    b.className='pbtn';
    b.textContent=i+1;
    b.onclick=()=>{current=i;showQuestion()};
    p.appendChild(b);
  });
  updatePalette();
}
function updatePalette(){
  [...document.querySelectorAll('.pbtn')].forEach((b,i)=>{
    b.className='pbtn';
    if(i===current)b.classList.add('current');
    if(answers[i]!==null)b.classList.add('answered');
    if(review[i])b.classList.add('review');
  });
}
function showQuestion(){
  const d=questions[current];
  document.getElementById('qno').textContent=`प्रश्न ${current+1} / ${questions.length}`;
  document.getElementById('question').textContent=d.q;
  document.getElementById('status').textContent=answers[current]===null?'अभी उत्तर नहीं दिया':'उत्तर चुना गया';
  const box=document.getElementById('options');
  box.innerHTML='';
  d.options.forEach((op,i)=>{
    const btn=document.createElement('button');
    btn.className='option'+(answers[current]===i?' selected':'');
    btn.textContent=String.fromCharCode(65+i)+') '+op;
    btn.onclick=()=>selectAnswer(i);
    box.appendChild(btn);
  });
  updatePalette();
  window.scrollTo({top:0,behavior:'smooth'});
}
function selectAnswer(i){
  answers[current]=i;
  showQuestion();
}
function toggleReview(){
  review[current]=!review[current];
  updatePalette();
}
function prevQuestion(){
  if(current>0){current--;showQuestion();}
}
function nextQuestion(){
  if(current<questions.length-1){current++;showQuestion();}
}
function startTimer(){
  timer=setInterval(()=>{
    timeLeft--;
    if(timeLeft<=0){clearInterval(timer);submitQuiz(true);return;}
    const h=Math.floor(timeLeft/3600);
    const m=Math.floor((timeLeft%3600)/60);
    const s=timeLeft%60;
    document.getElementById('timer').textContent=[h,m,s].map(x=>String(x).padStart(2,'0')).join(':');
  },1000);
}
function submitQuiz(auto=false){
  if(!auto && !confirm('क्या आप टेस्ट Submit करना चाहते हैं?')) return;
  clearInterval(timer);
  let correct=0,wrong=0,unattempted=0;
  answers.forEach((a,i)=>{
    if(a===null) unattempted++;
    else if(a===questions[i].answer) correct++;
    else wrong++;
  });
  const score=correct-(wrong*0.25);
  document.getElementById('quiz').style.display='none';
  document.querySelector('.palette-card').style.display='none';
  document.getElementById('result').style.display='block';
  document.getElementById('score').textContent=`Score: ${score.toFixed(2)} / 100`;
  document.getElementById('stats').innerHTML=
    `<p><b>सही:</b> ${correct} &nbsp; <b>गलत:</b> ${wrong} &nbsp; <b>छोड़े:</b> ${unattempted}</p>
     <p>Negative marking: गलत उत्तर पर −0.25</p>`;
}
renderPalette();
showQuestion();
startTimer();
</script>
